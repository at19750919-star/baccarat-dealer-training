<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D 空間配置工具</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;background:#1d2026;color:#e8eaed}
  #app{display:flex;flex-direction:column;height:100%}

  /* 工具列 */
  #bar{
    flex:0 0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    padding:8px 10px;background:#262a32;border-bottom:1px solid #353b45;z-index:10;
  }
  #bar .group{display:flex;gap:6px;align-items:center;background:#2f343d;border:1px solid #3b414c;border-radius:10px;padding:5px 8px}
  #bar label{font-size:.72rem;color:#aab2bd}
  #bar input[type=number]{width:52px;background:#1d2026;border:1px solid #444b56;color:#e8eaed;border-radius:6px;padding:4px 6px;font-size:.85rem;text-align:center}
  .sliders{gap:16px}
  .sl{display:flex;flex-direction:column;gap:2px;min-width:106px}
  .sl label{font-size:.72rem;color:#aab2bd}
  .sl label b{color:#fff;font-size:.8rem}
  .sl input[type=range]{
    -webkit-appearance:none;appearance:none;width:118px;height:6px;border-radius:6px;
    background:#444b56;outline:none;accent-color:#c0392b;cursor:pointer;
  }
  .sl input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;
    background:#c0392b;border:2px solid #e8eaed;cursor:pointer;
  }
  .sl input[type=range]::-moz-range-thumb{
    width:16px;height:16px;border-radius:50%;background:#c0392b;border:2px solid #e8eaed;cursor:pointer;
  }
  .btn{
    cursor:pointer;border:none;border-radius:8px;padding:7px 11px;font-size:.82rem;font-weight:600;
    background:#3a4150;color:#e8eaed;transition:background .15s,transform .05s;white-space:nowrap;
  }
  .btn:hover{background:#454e60}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:#c0392b}
  .btn.primary:hover{background:#d4493a}
  .btn.ghost{background:transparent;border:1px solid #4a5160}
  .sep{width:1px;height:26px;background:#3b414c;margin:0 2px}

  /* 家具選單 */
  #furnRow{
    flex:0 0 auto;display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:#21252c;border-bottom:1px solid #353b45;
    -webkit-overflow-scrolling:touch;
  }
  #furnRow::-webkit-scrollbar{height:5px}
  #furnRow::-webkit-scrollbar-thumb{background:#3b414c;border-radius:5px}
  .chip{
    cursor:pointer;flex:0 0 auto;border:1px solid #3b414c;background:#2c313a;color:#dfe3e8;
    border-radius:20px;padding:7px 13px;font-size:.8rem;display:flex;align-items:center;gap:7px;white-space:nowrap;
  }
  .chip:hover{background:#363c47}
  .chip .dot{width:11px;height:11px;border-radius:3px}
  .chip .sz{color:#8c95a3;font-size:.68rem}

  /* 舞台 */
  #stage{flex:1 1 auto;position:relative;min-height:0}
  #stage canvas{display:block;width:100%;height:100%;touch-action:none}

  /* 選取資訊 */
  #info{
    position:absolute;left:10px;bottom:10px;background:rgba(20,23,28,.86);backdrop-filter:blur(4px);
    border:1px solid #3b414c;border-radius:10px;padding:9px 12px;font-size:.78rem;color:#cfd5dd;max-width:70vw;
    pointer-events:none;opacity:0;transition:opacity .2s;line-height:1.5;
  }
  #info.show{opacity:1}
  #info b{color:#fff}

  /* 浮動選取操作 */
  #selbar{
    position:absolute;right:10px;bottom:10px;display:flex;gap:6px;opacity:0;pointer-events:none;transition:opacity .2s;
  }
  #selbar.show{opacity:1;pointer-events:auto}
  #selbar .btn{box-shadow:0 4px 14px rgba(0,0,0,.4)}

  /* 提示 */
  #hint{
    position:absolute;top:10px;left:50%;transform:translateX(-50%);
    background:rgba(20,23,28,.82);border:1px solid #3b414c;border-radius:20px;
    padding:7px 16px;font-size:.76rem;color:#aeb6c2;white-space:nowrap;
    transition:opacity .4s;
  }
  @media(max-width:560px){#hint{font-size:.68rem;white-space:normal;text-align:center;max-width:90vw}}

  #file{display:none}
  .toast{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    background:rgba(0,0,0,.85);color:#fff;padding:12px 18px;border-radius:10px;font-size:.85rem;
    opacity:0;transition:opacity .3s;pointer-events:none;z-index:50;
  }
  .toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">

  <div id="bar">
    <div class="group sliders">
      <div class="sl">
        <label>寬 <b id="rwv">4.0</b> m</label>
        <input id="rw" type="range" min="1" max="12" step="0.1" value="4">
      </div>
      <div class="sl">
        <label>長 <b id="rdv">3.0</b> m</label>
        <input id="rd" type="range" min="1" max="12" step="0.1" value="3">
      </div>
      <div class="sl">
        <label>高 <b id="rhv">2.7</b> m</label>
        <input id="rh" type="range" min="2" max="4" step="0.1" value="2.7">
      </div>
    </div>
    <div class="sep"></div>
    <button class="btn primary" id="uploadBtn">＋ 上傳照片</button>
    <button class="btn ghost" id="resetView">重置視角</button>
    <div class="sep"></div>
    <button class="btn ghost" id="saveBtn">儲存</button>
    <button class="btn ghost" id="loadBtn">讀取</button>
    <button class="btn ghost" id="clearBtn">清空</button>
  </div>

  <div id="furnRow"><!-- 家具 chips 由 JS 產生 --></div>

  <div id="stage">
    <div id="hint">單指拖曳家具・空白處單指旋轉視角・雙指縮放／平移</div>
    <div id="info"></div>
    <div id="selbar">
      <button class="btn" id="rotL">↶ 轉</button>
      <button class="btn" id="rotR">轉 ↷</button>
      <button class="btn" id="dupBtn">複製</button>
      <button class="btn primary" id="delBtn">刪除</button>
    </div>
  </div>
</div>

<input id="file" type="file" accept="image/*">
<div class="toast" id="toast"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------- 家具型錄（公尺：寬 × 高 × 深） ---------- */
const CATALOG = [
  { key:'sofa2',  name:'雙人沙發', w:2.0, h:0.8, d:0.9, color:0x6c7a89 },
  { key:'sofa1',  name:'單人沙發', w:0.95,h:0.8, d:0.9, color:0x8395a7 },
  { key:'bed',    name:'雙人床',   w:1.5, h:0.5, d:2.0, color:0xb8a18a },
  { key:'table',  name:'餐桌',     w:1.4, h:0.75,d:0.8, color:0xc0916b },
  { key:'chair',  name:'椅子',     w:0.45,h:0.9, d:0.45,color:0xa9744f },
  { key:'desk',   name:'書桌',     w:1.2, h:0.75,d:0.6, color:0x9b8466 },
  { key:'tvunit', name:'電視櫃',   w:1.6, h:0.5, d:0.4, color:0x5d6470 },
  { key:'tv',     name:'電視',     w:1.3, h:0.75,d:0.08,color:0x2b2f36 },
  { key:'wardr',  name:'衣櫃',     w:1.2, h:2.0, d:0.6, color:0x7d6b58 },
  { key:'fridge', name:'冰箱',     w:0.7, h:1.8, d:0.7, color:0xced4da },
  { key:'rug',    name:'地毯',     w:2.0, h:0.03,d:1.4, color:0xcc8e6f },
];

/* ---------- 場景 ---------- */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1d2026);

const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.1;
controls.maxPolarAngle = Math.PI/2 - 0.03;   // 不穿到地板下
controls.minDistance = 1.5;
controls.maxDistance = 40;

/* 燈光 */
scene.add(new THREE.HemisphereLight(0xffffff, 0x44484f, 0.85));
const dir = new THREE.DirectionalLight(0xffffff, 1.1);
dir.position.set(4, 8, 5);
dir.castShadow = true;
dir.shadow.mapSize.set(1024,1024);
dir.shadow.camera.near = 0.5; dir.shadow.camera.far = 50;
dir.shadow.camera.left=-15; dir.shadow.camera.right=15;
dir.shadow.camera.top=15; dir.shadow.camera.bottom=-15;
scene.add(dir);

/* ---------- 房間 ---------- */
let ROOM = { w:4, d:3, h:2.7 };
let roomGroup = new THREE.Group();
scene.add(roomGroup);
const floorPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);

function gridTexture(){
  const c = document.createElement('canvas'); c.width=c.height=128;
  const x = c.getContext('2d');
  x.fillStyle='#3a4250'; x.fillRect(0,0,128,128);
  x.fillStyle='#434c5c'; x.fillRect(2,2,124,124);
  x.strokeStyle='#566072'; x.lineWidth=4; x.strokeRect(0,0,128,128);
  const t = new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  return t;
}
const gridTex = gridTexture();

function buildRoom(){
  roomGroup.clear();
  const {w,d,h} = ROOM;
  // 地板
  gridTex.repeat.set(w, d);
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(w, d),
    new THREE.MeshStandardMaterial({ map:gridTex, roughness:0.95 })
  );
  floor.rotation.x = -Math.PI/2;
  floor.receiveShadow = true;
  floor.userData.isFloor = true;
  roomGroup.add(floor);
  // 牆（後牆 + 左牆，形成牆角好觀看）
  const wallMat = new THREE.MeshStandardMaterial({ color:0x2a2f38, roughness:1, side:THREE.DoubleSide });
  const back = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallMat);
  back.position.set(0, h/2, -d/2);
  back.receiveShadow = true; roomGroup.add(back);
  const left = new THREE.Mesh(new THREE.PlaneGeometry(d, h), wallMat);
  left.rotation.y = Math.PI/2;
  left.position.set(-w/2, h/2, 0);
  left.receiveShadow = true; roomGroup.add(left);
}

function frameRoom(){
  const {w,d,h} = ROOM;
  const r = Math.max(w,d);
  camera.position.set(w*0.55, h+r*0.9, d*0.95 + r*0.6);
  controls.target.set(0, 0.4, 0);
  controls.update();
}

/* ---------- 家具 ---------- */
const items = [];           // 可拖曳物件 (Group)
let selected = null;
let boxHelper = null;

function makeLabel(text){
  const c = document.createElement('canvas'); c.width=256; c.height=96;
  const x = c.getContext('2d');
  x.fillStyle='rgba(20,23,28,0.82)';
  roundRect(x,8,20,240,56,14); x.fill();
  x.fillStyle='#fff'; x.font='bold 40px "Noto Sans TC",sans-serif';
  x.textAlign='center'; x.textBaseline='middle';
  x.fillText(text, 128, 50);
  const tex = new THREE.CanvasTexture(c);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, depthTest:false, transparent:true }));
  spr.scale.set(0.7, 0.26, 1);
  spr.userData.isLabel = true;
  return spr;
}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function addFurniture(spec, pos){
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color:spec.color, roughness:0.75, metalness:0.02 });
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(spec.w, spec.h, spec.d), mat);
  mesh.castShadow = true; mesh.receiveShadow = true;
  mesh.position.y = spec.h/2;
  g.add(mesh);
  const label = makeLabel(spec.name);
  label.position.set(0, spec.h + 0.22, 0);
  g.add(label);
  g.userData = { type:'furniture', key:spec.key, name:spec.name, w:spec.w, h:spec.h, d:spec.d, color:spec.color, mesh };
  g.position.copy(pos || new THREE.Vector3(0,0,0));
  scene.add(g); items.push(g);
  select(g);
  return g;
}

function addPhoto(dataURL, widthM){
  const loader = new THREE.TextureLoader();
  loader.load(dataURL, (tex)=>{
    tex.colorSpace = THREE.SRGBColorSpace;
    const img = tex.image;
    const wM = widthM || 1.3;
    const hM = wM * (img.height/img.width);
    const g = new THREE.Group();
    const depth = 0.05;
    const frameMat = new THREE.MeshStandardMaterial({ color:0x15171c, roughness:0.6 });
    const faceMat  = new THREE.MeshStandardMaterial({ map:tex, roughness:0.5 });
    // 厚度盒，正面貼圖
    const box = new THREE.Mesh(new THREE.BoxGeometry(wM, hM, depth),
      [frameMat,frameMat,frameMat,frameMat, faceMat, frameMat]);
    box.castShadow = true; box.receiveShadow = true;
    box.position.y = hM/2 + 0.4;            // 像電視/掛畫離地一點
    g.add(box);
    // 細支架
    const stand = new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,0.4,8), frameMat);
    stand.position.y = 0.2; g.add(stand);
    g.userData = { type:'photo', img:dataURL, w:wM, h:hM, d:depth, mesh:box };
    g.position.set(0,0,-ROOM.d/2+0.3);       // 預設靠後牆
    scene.add(g); items.push(g);
    select(g);
  });
}

/* ---------- 選取 ---------- */
function select(g){
  selected = g;
  if(boxHelper){ scene.remove(boxHelper); boxHelper.geometry.dispose(); boxHelper=null; }
  if(g){
    boxHelper = new THREE.BoxHelper(g.userData.mesh, 0xff5a3c);
    boxHelper.material.depthTest = false;
    scene.add(boxHelper);
  }
  updateUI();
}
function clearSelection(){ select(null); }

function updateUI(){
  const info = document.getElementById('info');
  const selbar = document.getElementById('selbar');
  if(selected){
    const u = selected.userData;
    const deg = Math.round((selected.rotation.y*180/Math.PI)%360);
    info.innerHTML = `<b>${u.type==='photo'?'照片':u.name}</b>　尺寸 ${u.w.toFixed(2)}×${u.d.toFixed(2)} m・高 ${u.h.toFixed(2)} m・旋轉 ${((deg%360)+360)%360}°`;
    info.classList.add('show'); selbar.classList.add('show');
  } else {
    info.classList.remove('show'); selbar.classList.remove('show');
  }
}

/* 邊界內夾住 */
function clampInRoom(g){
  const u = g.userData;
  const halfW = ROOM.w/2 - 0.05, halfD = ROOM.d/2 - 0.05;
  // 以較大半邊估算（忽略旋轉，足夠用）
  const ex = Math.max(u.w,u.d)/2;
  g.position.x = Math.min(halfW-ex*0+halfW, Math.max(-halfW, g.position.x));
  g.position.z = Math.min(halfD, Math.max(-halfD, g.position.z));
  g.position.x = Math.min(halfW, Math.max(-halfW, g.position.x));
}

/* ---------- 拖曳 ---------- */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let dragging = false;
const dragOffset = new THREE.Vector3();
const hitPoint = new THREE.Vector3();

function setNDC(e){
  const r = renderer.domElement.getBoundingClientRect();
  ndc.x = ((e.clientX - r.left)/r.width)*2 - 1;
  ndc.y = -((e.clientY - r.top)/r.height)*2 + 1;
}
function pickItem(){
  raycaster.setFromCamera(ndc, camera);
  const meshes = items.map(g=>g.userData.mesh);
  const hits = raycaster.intersectObjects(meshes, false);
  if(hits.length){
    let o = hits[0].object;
    return items.find(g=>g.userData.mesh===o) || null;
  }
  return null;
}

renderer.domElement.addEventListener('pointerdown', (e)=>{
  setNDC(e);
  const g = pickItem();
  if(g){
    select(g);
    dragging = true;
    controls.enabled = false;
    raycaster.setFromCamera(ndc, camera);
    raycaster.ray.intersectPlane(floorPlane, hitPoint);
    dragOffset.set(g.position.x - hitPoint.x, 0, g.position.z - hitPoint.z);
    renderer.domElement.setPointerCapture(e.pointerId);
  } else {
    clearSelection();
  }
});
renderer.domElement.addEventListener('pointermove', (e)=>{
  if(!dragging || !selected) return;
  setNDC(e);
  raycaster.setFromCamera(ndc, camera);
  if(raycaster.ray.intersectPlane(floorPlane, hitPoint)){
    selected.position.x = hitPoint.x + dragOffset.x;
    selected.position.z = hitPoint.z + dragOffset.z;
    clampInRoom(selected);
    updateUI();
  }
});
function endDrag(e){
  if(dragging){
    dragging=false; controls.enabled=true;
    try{ renderer.domElement.releasePointerCapture(e.pointerId); }catch(_){}
  }
}
renderer.domElement.addEventListener('pointerup', endDrag);
renderer.domElement.addEventListener('pointercancel', endDrag);

/* ---------- 操作按鈕 ---------- */
function rotateSel(rad){ if(selected){ selected.rotation.y += rad; updateUI(); } }
document.getElementById('rotL').onclick = ()=>rotateSel(-Math.PI/12);
document.getElementById('rotR').onclick = ()=>rotateSel(Math.PI/12);
document.getElementById('delBtn').onclick = ()=>{
  if(!selected) return;
  scene.remove(selected);
  items.splice(items.indexOf(selected),1);
  clearSelection();
};
document.getElementById('dupBtn').onclick = ()=>{
  if(!selected) return;
  const u = selected.userData;
  const p = selected.position.clone().add(new THREE.Vector3(0.3,0,0.3));
  let g;
  if(u.type==='photo'){ addPhoto(u.img, u.w); return; }
  const spec = CATALOG.find(s=>s.key===u.key);
  g = addFurniture(spec, p);
  g.rotation.y = selected.rotation.y;
  clampInRoom(g);
};

window.addEventListener('keydown',(e)=>{
  if(e.target.tagName==='INPUT') return;
  if((e.key==='Delete'||e.key==='Backspace') && selected){ e.preventDefault(); document.getElementById('delBtn').click(); }
  if(e.key==='r'||e.key==='R') rotateSel(Math.PI/12);
});

/* ---------- 工具列 ---------- */
const $ = id=>document.getElementById(id);
function applyRoomLive(){
  ROOM.w = parseFloat($('rw').value);
  ROOM.d = parseFloat($('rd').value);
  ROOM.h = parseFloat($('rh').value);
  $('rwv').textContent = ROOM.w.toFixed(1);
  $('rdv').textContent = ROOM.d.toFixed(1);
  $('rhv').textContent = ROOM.h.toFixed(1);
  buildRoom();
  items.forEach(clampInRoom);
  if(selected) select(selected);
}
['rw','rd','rh'].forEach(id=>$(id).addEventListener('input', applyRoomLive));
function syncSliders(){
  $('rw').value=ROOM.w; $('rd').value=ROOM.d; $('rh').value=ROOM.h;
  $('rwv').textContent=(+ROOM.w).toFixed(1);
  $('rdv').textContent=(+ROOM.d).toFixed(1);
  $('rhv').textContent=(+ROOM.h).toFixed(1);
}
$('resetView').onclick = frameRoom;

$('uploadBtn').onclick = ()=>$('file').click();
$('file').onchange = (e)=>{
  const f = e.target.files[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = ev=> addPhoto(ev.target.result);
  reader.readAsDataURL(f);
  e.target.value='';
};

$('clearBtn').onclick = ()=>{
  if(!items.length) return;
  if(!confirm('清空所有家具與照片？')) return;
  items.slice().forEach(g=>scene.remove(g));
  items.length=0; clearSelection();
};

/* ---------- 存讀（localStorage） ---------- */
const KEY='room3d_v1';
$('saveBtn').onclick = ()=>{
  const data = {
    room:ROOM,
    items: items.map(g=>({
      type:g.userData.type, key:g.userData.key, img:g.userData.img, w:g.userData.w,
      x:g.position.x, z:g.position.z, ry:g.rotation.y
    }))
  };
  try{ localStorage.setItem(KEY, JSON.stringify(data)); toast('已儲存 ✓'); }
  catch(err){ toast('儲存失敗：照片太多/太大'); }
};
$('loadBtn').onclick = ()=>loadState(true);
function loadState(notify){
  const raw = localStorage.getItem(KEY);
  if(!raw){ if(notify) toast('沒有已儲存的配置'); return; }
  const data = JSON.parse(raw);
  ROOM = Object.assign({w:4,d:3,h:2.7}, data.room);
  syncSliders();
  buildRoom();
  items.slice().forEach(g=>scene.remove(g)); items.length=0; clearSelection();
  (data.items||[]).forEach(it=>{
    if(it.type==='photo'){ addPhoto(it.img, it.w); /* 位置稍後 */
      // addPhoto 為非同步，延遲設定位置
      const tryset=()=>{ const g=items[items.length-1]; if(g&&g.userData.type==='photo'){g.position.set(it.x,0,it.z);g.rotation.y=it.ry;} };
      setTimeout(tryset,120);
    } else {
      const spec = CATALOG.find(s=>s.key===it.key); if(!spec) return;
      const g = addFurniture(spec, new THREE.Vector3(it.x,0,it.z));
      g.rotation.y = it.ry;
    }
  });
  clearSelection();
  if(notify) toast('已讀取 ✓');
}

/* ---------- Toast ---------- */
let toastT;
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1600);
}

/* ---------- 家具列 ---------- */
const furnRow = document.getElementById('furnRow');
CATALOG.forEach(spec=>{
  const chip = document.createElement('div');
  chip.className='chip';
  chip.innerHTML = `<span class="dot" style="background:#${spec.color.toString(16).padStart(6,'0')}"></span>${spec.name}<span class="sz">${spec.w}×${spec.d}m</span>`;
  chip.onclick = ()=>{ addFurniture(spec, new THREE.Vector3(0,0,0)); };
  furnRow.appendChild(chip);
});

/* ---------- 自適應 ---------- */
function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w,h,false);
  camera.aspect = w/h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

/* ---------- 啟動 ---------- */
buildRoom();
frameRoom();
resize();
loadState(false);

(function animate(){
  requestAnimationFrame(animate);
  controls.update();
  if(boxHelper) boxHelper.update();
  renderer.render(scene, camera);
})();

// 自動隱藏提示
setTimeout(()=>{ const h=document.getElementById('hint'); if(h) h.style.opacity='0'; }, 6000);
</script>
