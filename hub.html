<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的網站總覽</title>
<link rel="apple-touch-icon" href="icons/hub-180.png">
<link rel="icon" type="image/png" href="icons/hub-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1b2430">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="我的總覽">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    background:linear-gradient(160deg,#1b2430,#0f1620);color:#e8eef5;min-height:100vh;padding:28px 16px 60px}
  .wrap{max-width:820px;margin:0 auto}
  header{text-align:center;margin-bottom:28px}
  header h1{font-size:1.7rem;letter-spacing:.05em;margin-bottom:6px}
  header p{color:#8fa0b3;font-size:.9rem}
  .grp{margin:26px 0 10px;color:#6fd1a6;font-size:.82rem;letter-spacing:.18em;font-weight:700;
    border-bottom:1px solid rgba(111,209,166,.25);padding-bottom:6px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;
    padding:16px 16px 14px;display:flex;flex-direction:column;gap:6px;transition:transform .15s,background .15s}
  .card:hover{transform:translateY(-3px);background:rgba(255,255,255,.07)}
  .card .name{font-size:1.05rem;font-weight:700;display:flex;align-items:center;gap:7px}
  .card .desc{color:#9fb0c2;font-size:.82rem;line-height:1.6;flex:1}
  .tag{font-size:.62rem;padding:1px 7px;border-radius:10px;background:rgba(255,255,255,.1);color:#b9c6d4}
  .tag.guess{background:rgba(230,170,60,.18);color:#e6b455}
  .tag.star{background:rgba(111,209,166,.2);color:#6fd1a6}
  .open{margin-top:6px;text-align:center;text-decoration:none;background:#2f6df0;color:#fff;
    border-radius:9px;padding:9px;font-size:.85rem;font-weight:700;transition:background .15s}
  .open:hover{background:#3f7bff}
  .open.alt{background:#c0392b}.open.alt:hover{background:#d4493a}
  footer{text-align:center;margin-top:34px;color:#6b7c8f;font-size:.78rem;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🗂️ 我的網站總覽</h1>
    <p>點任一張卡片的按鈕即可開啟該網頁・把這頁加到手機桌面最方便</p>
  </header>

  <div class="grp">⭐ 精選工具</div>
  <div class="grid">
    <div class="card">
      <div class="name">達摩祖師 <span class="tag star">介紹頁</span></div>
      <div class="desc">禪宗初祖介紹・水墨書法風格</div>
      <a class="open alt" href="damo.html" target="_blank" rel="noopener">開啟</a>
    </div>
    <div class="card">
      <div class="name">3D 空間配置 <span class="tag star">工具</span></div>
      <div class="desc">擺家具、上傳照片、匯入 3D 模型,規劃居家空間</div>
      <a class="open alt" href="planner.html" target="_blank" rel="noopener">開啟</a>
    </div>
    <div class="card">
      <div class="name">荷官訓練</div>
      <div class="desc">百家樂荷官訓練／審核標準</div>
      <a class="open alt" href="https://at19750919-star.github.io/baccarat-dealer-training/" target="_blank" rel="noopener">開啟</a>
    </div>
    <div class="card">
      <div class="name">UI 詞典 <span class="tag star">速查</span></div>
      <div class="desc">可視化 UI 組件速查・每個組件有迷你預覽＋文字說明,寫提示詞前先翻</div>
      <a class="open" href="ui-dictionary.html" target="_blank" rel="noopener">開啟</a>
    </div>
  </div>

  <div class="grp">🎰 百家樂相關</div>
  <div class="grid" id="g-bacc"></div>

  <div class="grp">🌌 其他專案</div>
  <div class="grid" id="g-other"></div>
</div>

<footer>
  共 16 個專案　|　標「推測」者為依名稱推斷,實際內容以開啟後為準<br>
  打不開（404）代表該專案尚未開啟 GitHub Pages
</footer>

<script>
  const bacc=[
    {n:'AT666',d:'百家樂分析工具 + 手動輸入',u:'https://at19750919-star.github.io/AT666/'},
    {n:'baccarat-roadmap',d:'百家樂路紙',u:'https://at19750919-star.github.io/baccarat-roadmap/',g:1},
  ];
  const other=[
    {n:'corey',d:'揭露宇宙 Corey Goode 集數索引',u:'https://at19750919-star.github.io/corey/'},
    {n:'corey02',d:'揭露宇宙 集數索引 v2',u:'https://at19750919-star.github.io/corey02/',g:1},
    {n:'spiritual-map',d:'靈性地圖閱讀頁',u:'https://at19750919-star.github.io/spiritual-map/'},
    {n:'snow',d:'飄雪視覺效果',u:'https://at19750919-star.github.io/snow/',g:1},
    {n:'my-dashboard',d:'個人儀表板',u:'https://at19750919-star.github.io/my-dashboard/',g:1},
    {n:'loan-ledger',d:'借款記帳本',u:'https://at19750919-star.github.io/loan-ledger/',g:1},
    {n:'pattaya-trip',d:'芭達雅旅遊行程',u:'https://at19750919-star.github.io/pattaya-trip/',g:1},
    {n:'Liao',d:'「友謙」頁',u:'https://at19750919-star.github.io/Liao/',g:1},
    {n:'one',d:'單頁／測試',u:'https://at19750919-star.github.io/one/',g:1},
    {n:'ATLL',d:'AT 系列',u:'https://at19750919-star.github.io/ATLL/',g:1},
    {n:'ATYOYO',d:'AT 系列',u:'https://at19750919-star.github.io/ATYOYO/',g:1},
    {n:'AT',d:'AT 系列',u:'https://at19750919-star.github.io/AT/',g:1},
    {n:'aatt',d:'用途不明',u:'https://at19750919-star.github.io/aatt/',g:1},
  ];
  function card(p){
    return `<div class="card"><div class="name">${p.n} ${p.g?'<span class="tag guess">推測</span>':''}</div>`
      +`<div class="desc">${p.d}</div>`
      +`<a class="open" href="${p.u}" target="_blank" rel="noopener">開啟</a></div>`;
  }
  document.getElementById('g-bacc').innerHTML = bacc.map(card).join('');
  document.getElementById('g-other').innerHTML = other.map(card).join('');
</script>
</body>
</html>
